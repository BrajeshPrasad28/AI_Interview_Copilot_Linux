                <aside class="hub-sidebar" aria-label="Dashboard actions">
                    <div class="sidebar-heading">
                        <span class="sidebar-section-label">COPILOT</span>
                        <button type="button" class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()"
                            aria-label="Expand sidebar" aria-expanded="false" title="Expand sidebar">
                            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none"
                                stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                                <path d="M3 4.5h12M3 9h12M3 13.5h12"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="sidebar-actions">
                        <button type="button" class="sidebar-action sidebar-action-active" id="home-nav-button"
                            onclick="showDashboard()" title="Home" aria-label="Home" aria-current="page">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m3 10 9-7 9 7"></path>
                                    <path d="M5 9v12h14V9M9 21v-7h6v7"></path>
                                </svg>
                            </span><span class="sidebar-action-label">Home</span>
                        </button>
                        <input type="file" id="resume-file-input" accept=".pdf,application/pdf" hidden
                            onchange="uploadResumeFile(this)">
                        <button type="button" class="sidebar-action" id="profile-nav-button"
                            onclick="openProfileSettings()" title="Profile" aria-label="Profile">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path
                                        d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z">
                                    </path>
                                </svg>
                            </span><span class="sidebar-action-label">Profile</span>
                        </button>
                        <button type="button" class="sidebar-action" id="customize-nav-button"
                            onclick="openCustomizeSettings()" title="Customize" aria-label="Customize">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3"></path>
                                    <path d="M1 14h6m2-6h6m2 8h6"></path>
                                </svg>
                            </span><span class="sidebar-action-label">Customize</span>
                        </button>
                        <button type="button" class="sidebar-action" id="notes-nav-button" onclick="openNotesManager()"
                            title="Notes" aria-label="Notes">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                            </span><span class="sidebar-action-label">Notes</span>
                        </button>
                        <button type="button" class="sidebar-action" id="history-nav-button"
                            onclick="openSessionHistory()" title="History" aria-label="History">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"></path>
                                    <path d="M3 3v5h5M12 7v5l3 2"></path>
                                </svg>
                            </span><span class="sidebar-action-label">History</span>
                        </button>
                        <button type="button" class="sidebar-action" id="credits-nav-button" onclick="openCreditsView()"
                            title="Credit &amp; History" aria-label="Credit &amp; History">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9"></circle>
                                    <path
                                        d="M14.8 9A2 2 0 0 0 13 8h-2a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4h-2a2 2 0 0 1-1.8-1">
                                    </path>
                                    <path d="M12 6v2m0 8v2"></path>
                                </svg>
                            </span><span class="sidebar-action-label">Credit &amp; History</span>
                        </button>
                        <button type="button" class="sidebar-action" onclick="minimizeWindow()" title="Phone Stealth"
                            aria-label="Phone Stealth">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"></path>
                                    <circle cx="12" cy="12" r="2.5"></circle>
                                    <path d="M4 4 20 20"></path>
                                </svg>
                            </span><span class="sidebar-action-label">Phone Stealth</span>
                        </button>
                        <button type="button" class="sidebar-action" id="help-nav-button" onclick="openHelpView()"
                            title="Help &amp; Guide" aria-label="Help &amp; Guide">
                            <span class="sidebar-action-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </span><span class="sidebar-action-label">Help</span>
                        </button>
                    </div>
                </aside>
