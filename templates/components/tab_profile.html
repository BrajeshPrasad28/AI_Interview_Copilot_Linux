                <section id="profile-settings-view" class="profile-settings-view"
                    aria-labelledby="profile-settings-title">
                    <div class="profile-settings-panel">
                        <div class="profile-settings-header">
                            <h2 id="profile-settings-title">Profile</h2>
                            <p style="color: var(--text-secondary); font-size: 0.76rem; margin-top: 4px;">
                                Manage your personal interview candidate details &amp; resume. All fields are mandatory.
                            </p>
                        </div>
                        <section class="profile-settings-section">
                            <h3>Personal Details</h3>
                            
                            <!-- User Name -->
                            <div class="profile-setting">
                                <label for="profile-name">
                                    <span class="profile-label-left">
                                        User Name <span class="required-star">*</span>
                                        <span id="profile-name-valid" class="validation-tick" style="display: none;" title="Valid name">
                                            <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
                                                <circle cx="10" cy="10" r="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
                                                <path d="M6 10l2.5 2.5L14 7.5" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </span>
                                    <span class="profile-char-hint">3 - 50 chars</span>
                                </label>
                                <input id="profile-name" type="text" minlength="3" maxlength="50" autocomplete="name"
                                    placeholder="Enter your full name">
                                <div id="profile-name-error" class="field-validation-error" style="display: none;"></div>
                            </div>

                            <!-- Email Address -->
                            <div class="profile-setting">
                                <label for="profile-email">
                                    <span class="profile-label-left">
                                        Email Address <span class="required-star">*</span>
                                        <span id="profile-email-valid" class="validation-tick" style="display: none;" title="Valid email">
                                            <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
                                                <circle cx="10" cy="10" r="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
                                                <path d="M6 10l2.5 2.5L14 7.5" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </span>
                                    <span class="profile-char-hint">e.g. name@example.com</span>
                                </label>
                                <input id="profile-email" type="email" maxlength="80" autocomplete="email"
                                    placeholder="Enter your email address">
                                <div id="profile-email-error" class="field-validation-error" style="display: none;"></div>
                            </div>

                            <!-- Phone Number -->
                            <div class="profile-setting">
                                <label for="profile-phone">
                                    <span class="profile-label-left">
                                        Phone Number <span class="required-star">*</span>
                                        <span id="profile-phone-valid" class="validation-tick" style="display: none;" title="Valid 10-digit mobile number">
                                            <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
                                                <circle cx="10" cy="10" r="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
                                                <path d="M6 10l2.5 2.5L14 7.5" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </span>
                                    <span class="profile-char-hint">+91 &amp; 10 digits</span>
                                </label>
                                <input id="profile-phone" type="tel" maxlength="15" autocomplete="tel"
                                    placeholder="+91 9876543210" value="+91 ">
                                <div id="profile-phone-error" class="field-validation-error" style="display: none;"></div>
                            </div>
                        </section>

                        <section class="profile-settings-section">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; flex-wrap: wrap;">
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <h3 style="margin-bottom: 0;">Resume</h3>
                                    <span class="required-star">*</span>
                                    <span id="profile-resume-valid" class="validation-tick" style="display: none;" title="Resume uploaded & active">
                                        <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
                                            <circle cx="10" cy="10" r="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
                                            <path d="M6 10l2.5 2.5L14 7.5" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </span>
                                </div>
                                <button type="button" class="btn-action" id="btn-upload-resume-desktop"
                                    onclick="document.getElementById('resume-file-input').click()">Upload PDF Resume</button>
                            </div>

                            <!-- Saved Resume Status Card with Delete Button -->
                            <div id="desktop-saved-resume-card" class="desktop-saved-resume-card" style="display: none;">
                                <div class="saved-resume-info-desktop">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14 2 14 8 20 8"></polyline>
                                        <line x1="16" y1="13" x2="8" y2="13"></line>
                                        <line x1="16" y1="17" x2="8" y2="17"></line>
                                        <polyline points="10 9 9 9 8 9"></polyline>
                                    </svg>
                                    <div style="min-width: 0; flex: 1;">
                                        <div id="desktop-resume-filename" class="saved-resume-name-desktop">resume.pdf</div>
                                        <div id="desktop-resume-meta" class="saved-resume-meta-desktop">Saved on this device &amp; ready for AI</div>
                                    </div>
                                </div>
                                <button type="button" class="btn-icon-danger" onclick="deleteResumeFile()" title="Delete saved resume"
                                    aria-label="Delete saved resume">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        <line x1="10" y1="11" x2="10" y2="17"></line>
                                        <line x1="14" y1="11" x2="14" y2="17"></line>
                                    </svg>
                                </button>
                            </div>

                            <div id="profile-resume-error" class="field-validation-error" style="display: none; margin-top: 6px;"></div>
                        </section>
                    </div>
                </section>
